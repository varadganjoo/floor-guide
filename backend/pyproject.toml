[project]
name = "tech-interview-backend"
version = "0.1.0"
description = "FastAPI backend for TechInterviewEnv"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "langchain>=1.5.2",
    "langchain-openai>=1.8.5",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "openai>=3.58.0",
    "pydantic-settings>=2.16.3",
    "python-docx>=1.2.0",
    "tiktoken>=0.14.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
